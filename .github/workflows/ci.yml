name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # node --test glob patterns need ≥22; the shipped runtime itself only requires >=20
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # blueprint §6.3: every change re-runs the corpus — gate exits nonzero on regression
      - run: node dist/eval/harness.js --routing --gate
